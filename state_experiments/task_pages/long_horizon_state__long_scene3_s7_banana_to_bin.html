<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>State Experiment Review</title>
  <style>
    :root {
      --ink: #15130f;
      --muted: #776f62;
      --paper: #f7f1e4;
      --panel: rgba(255, 252, 244, 0.88);
      --line: rgba(35, 29, 18, 0.16);
      --coal: #25231e;
      --good: #2e7d57;
      --bad: #b7442f;
      --warn: #b8860b;
      --accent: #d35f2d;
      --blue: #1e5b73;
      --shadow: 0 18px 45px rgba(38, 30, 16, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(211, 95, 45, .18), transparent 28rem),
        radial-gradient(circle at 86% 3%, rgba(30, 91, 115, .16), transparent 24rem),
        linear-gradient(135deg, #fbf5e7 0%, #eee1cb 54%, #ead7b7 100%);
      font-family: Charter, Georgia, "Times New Roman", serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mix-blend-mode: multiply;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 241, 228, .84);
      backdrop-filter: blur(18px);
    }
    .topbar {
      max-width: 1880px;
      margin: 0 auto;
      padding: 12px 24px 10px;
      display: grid;
      grid-template-columns: minmax(430px, .9fr) minmax(620px, 1.4fr);
      gap: 20px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-family: Didot, "Bodoni 72", Georgia, serif;
      font-size: clamp(30px, 3vw, 44px);
      line-height: .92;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }
    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      max-width: 760px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
    }
    .remember-token {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .remember-token input {
      width: auto;
      margin: 0;
    }
    select, input, button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.65);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 13px;
      font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }
    #sectionSelect { min-width: 220px; }
    #taskSelect { min-width: 310px; max-width: 520px; }
    #resultFilter, #layoutMode { min-width: 190px; }
    #groupSearch { width: 120px; }
    button {
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    button:hover { transform: translateY(-1px); background: white; }
    main {
      max-width: 1880px;
      margin: 0 auto;
      padding: 22px 24px 80px;
    }
    .task-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tab {
      border-radius: 18px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .45);
      cursor: pointer;
      font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tab.active {
      background: var(--coal);
      color: #fff7e8;
      box-shadow: var(--shadow);
    }
    .scene-card {
      display: none;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .scene-card.active { display: block; }
    .scene-head {
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(420px, .9fr) minmax(620px, 1.6fr);
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255,255,255,.62), rgba(255,255,255,.2));
    }
    .scene-title {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.02em;
    }
    .score-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-content: center;
      max-width: 1240px;
    }
    .score {
      min-width: 118px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.52);
    }
    .score.best {
      background: #1f372b;
      color: #fff8e9;
      border-color: transparent;
    }
    .score.best .name { color: rgba(255,248,233,.72); }
    .score .name {
      color: var(--muted);
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }
    .score .value {
      margin-top: 3px;
      font: 800 22px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .mode-toggles {
      padding: 14px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(255,255,255,.45);
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .mode-toggle input { width: auto; margin: 0; }
    .legend {
      margin-left: auto;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .method-guide {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 12px;
      padding: 0 18px 16px;
      border-bottom: 1px solid var(--line);
    }
    .method-guide-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 13px;
      background: rgba(255,255,255,.44);
    }
    .method-guide-card h3 {
      margin: 0 0 6px;
      font: 900 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
      color: var(--ink);
      letter-spacing: .02em;
    }
    .method-guide-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
    }
    .method-guide-card code {
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--blue);
      background: rgba(255,255,255,.62);
      border-radius: 6px;
      padding: 1px 4px;
    }
    .group-list { padding: 18px; display: grid; gap: 18px; }
    .group-row {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.48);
      overflow: hidden;
    }
    .group-row.selection-win {
      border-color: rgba(46, 125, 87, .55);
      box-shadow: inset 6px 0 0 var(--good);
    }
    .group-row.any-fail:not(.selection-win) {
      box-shadow: inset 6px 0 0 rgba(183, 68, 47, .78);
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font: 800 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(37,35,30,.055);
    }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border-radius: 999px;
      padding: 3px 8px;
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid var(--line);
    }
    .chip.good { color: white; background: var(--good); border-color: transparent; }
    .chip.bad { color: white; background: var(--bad); border-color: transparent; }
    .chip.partial { color: white; background: var(--warn); border-color: transparent; }
    .chip.wait { color: white; background: var(--blue); border-color: transparent; }
    .chip.missing { color: var(--muted); background: rgba(255,255,255,.5); }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(var(--visible-cols, 5), minmax(300px, 1fr));
      gap: 1px;
      background: var(--line);
    }
    .video-card {
      background: #fffaf0;
      min-width: 0;
      padding: 12px;
    }
    .video-card.success {
      background: linear-gradient(180deg, rgba(46,125,87,.10), #fffaf0 58%);
    }
    .video-card.failure {
      background: linear-gradient(180deg, rgba(183,68,47,.12), #fffaf0 58%);
    }
    .video-card.partial {
      background: linear-gradient(180deg, rgba(184,134,11,.15), #fffaf0 58%);
    }
    .video-card.wait {
      background: linear-gradient(180deg, rgba(30,91,115,.16), #fffaf0 58%);
    }
    .video-card.unclear {
      background: linear-gradient(180deg, rgba(119,111,98,.12), #fffaf0 58%);
    }
    .video-card.baseline {
      border-top: 4px solid var(--coal);
    }
    .video-card.hidden-mode { display: none; }
    .video-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .badge {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      color: white;
      background: var(--muted);
    }
    .badge.good { background: var(--good); }
    .badge.bad { background: var(--bad); }
    .badge.partial { background: var(--warn); }
    .badge.wait { background: var(--blue); }
    .badge.manual { background: var(--blue); }
    .audit-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 10px;
      align-items: center;
      padding: 8px;
      border: 1px dashed rgba(30, 91, 115, .36);
      border-radius: 12px;
      background: rgba(255,255,255,.58);
    }
    .audit-btn {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      background: rgba(255,255,255,.7);
    }
    .audit-btn[data-audit-action="success"] { border-color: rgba(46, 125, 87, .55); }
    .audit-btn[data-audit-action="partial"] { border-color: rgba(184, 134, 11, .55); }
    .audit-btn[data-audit-action="fail"] { border-color: rgba(183, 68, 47, .55); }
    .audit-btn[data-audit-action="unclear"] { border-color: rgba(184, 134, 11, .55); }
    .audit-btn[data-audit-action="wait_for_tag"] { border-color: rgba(30, 91, 115, .55); }
    .audit-btn.active-success {
      color: white;
      background: var(--good);
      border-color: transparent;
    }
    .audit-btn.active-fail {
      color: white;
      background: var(--bad);
      border-color: transparent;
    }
    .audit-btn.active-partial {
      color: white;
      background: var(--warn);
      border-color: transparent;
    }
    .audit-btn.active-unclear {
      color: white;
      background: var(--warn);
      border-color: transparent;
    }
    .audit-btn.active-wait_for_tag {
      color: white;
      background: var(--blue);
      border-color: transparent;
    }
    .video-card.manual-override {
      outline: 3px solid rgba(30, 91, 115, .42);
      outline-offset: -3px;
    }
    .manual-note {
      color: var(--blue);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .manual-note.dirty {
      color: var(--warn);
    }
    .audit-label {
      color: var(--blue);
      font: 900 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    #overrideCount {
      color: var(--blue);
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 0 4px;
    }
    #saveStatus {
      min-width: 180px;
      color: var(--muted);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .server-help {
      display: none;
      grid-column: 1 / -1;
      width: min(980px, 100%);
      margin-left: auto;
      padding: 12px 14px;
      border: 1px solid rgba(184, 134, 11, .32);
      border-radius: 16px;
      background: rgba(255, 246, 214, .84);
      color: #56431a;
      font: 700 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .server-help.visible { display: block; }
    .server-help code {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.8);
      color: #1e1a12;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: all;
    }
    video, .fallback-img {
      width: 100%;
      height: clamp(190px, 20vw, 320px);
      object-fit: contain;
      background: #15130f;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.16);
      display: block;
    }
    .fallback-img.contact-fallback { display: none; }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .thumbs img {
      width: 100%;
      aspect-ratio: 1.35;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: white;
    }
    .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      min-height: 16px;
    }
    .empty {
      min-height: 210px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      border-radius: 14px;
      background: rgba(0,0,0,.035);
    }
    .is-filtered { display: none; }
    body.layout-cinema .video-grid {
      grid-template-columns: repeat(2, minmax(540px, 1fr)) !important;
      gap: 12px;
      background: transparent;
      padding: 12px;
    }
    body.layout-cinema .video-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(38, 30, 16, .08);
    }
    body.layout-cinema video,
    body.layout-cinema .fallback-img {
      height: clamp(220px, 22vw, 360px);
    }
    body.layout-contact .video-card video {
      display: none;
    }
    body.layout-contact .fallback-img.contact-fallback {
      display: block;
    }
    @media (max-width: 980px) {
      .topbar, .scene-head { grid-template-columns: 1fr; }
      .controls, .score-strip { justify-content: flex-start; }
      h1 { white-space: normal; }
      .video-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body class="layout-cinema">
  <header>
    <div class="topbar">
      <div>
        <h1>State Experiment Review</h1>
        <div class="subtitle">State experiment rollouts grouped by state, horizon, and experiment family. All labels start as wait_for_tag for fresh human review.</div>
      </div>
      <div class="controls">
        <select id="sectionSelect"></select>
        <select id="sceneSelect"></select>
        <select id="taskSelect"></select>

          <option value="selection-win">selection beats baseline</option>

        <select id="layoutMode">

          <option value="contact">final-frame contact</option>

        <input id="groupSearch" placeholder="group id" />

        <input id="reviewerId" placeholder="reviewer id" autocomplete="off" />
        <input id="writeSecret" type="password" placeholder="write secret" autocomplete="off" />
        <button id="saveAuditBackend">save via backend</button>
        <button id="loadAuditBackend">load my backend audit</button>
        <button id="checkBackend">check backend</button>
        <button id="clearManualAudit">clear edits</button>
        <span id="overrideCount">0 edits</span>
        <span id="saveStatus">not saved</span>

        <button id="playVisible">play visible</button>
        <button id="pauseVisible">pause</button>
        <div id="serverHelp" class="server-help"></div>
      </div>
    </div>
  </header>
  <main>
    <div id="tabs" class="task-tabs"></div>
    <div id="cards"></div>
  </main>

    function pct(value) {

      if (itemOrValue === true) return 'success';

    }

      const text = status === 'success' ? '✓' : status === 'partial' ? '½' : status === 'fail' ? '×' : status === 'wait_for_tag' ? 'tag' : '?';
      return `<span class="chip ${cls}">${label} ${text}</span>`;

    function modeChipLabel(modeId, modeLabel) {

        target_feature_last_retrieved_success_exclude_self_g20_k5: 'Rollout-Final-ViT',
        d2c_latent_l2_target_zero: 'Branch-Zero-L2',
        d2c_decoded_pixel_l1_schedule: 'Branch-Sub-L1',

        coarse_unordered_vit_g5_k3: 'Coarse-Unord',
        hierarchical_fixed_vit_g5_k3: 'Hier-Fixed',
        hierarchical_unordered_vit_g5_k3: 'Hier-Unord',
        breakthrough_fixed_vit_k5: 'Breakthrough-Fixed',
      };
      return labels[modeId] || modeLabel.split(' ')[0];
    }
    function methodGuide(task) {
      const modeIds = new Set(task.modes.map(mode => mode.mode));
      const hasRolloutSelect = Array.from(modeIds).some(mode => mode.startsWith('target_'));
      const hasDenoiseBranch = Array.from(modeIds).some(mode => mode.startsWith('d2c_'));
      const hasBreakthroughBank = modeIds.has('breakthrough_fixed_vit_k5');
      const hasLongHorizon = task.section === 'long_horizon';
      const hasThreeObjectLongHorizon = task.section === 'three_object_long_horizon';
      const cards = [
        `<section class="method-guide-card"><h3>Baseline</h3><p><code>DreamZero pass@1</code>: one normal rollout from the fixed initial state. No target image, no candidate selection, no branch intervention.</p></section>`
      ];
      if (hasLongHorizon) {
        cards.push(`<section class="method-guide-card"><h3>Long-Horizon Rule</h3><p>Full success requires <code>both ordered subtasks</code>. If only the first subtask is completed, mark <code>partial</code>, not success. Selection labels marked preliminary should be re-checked with the full rollout video.</p></section>`);
        cards.push(`<section class="method-guide-card"><h3>Coarse vs Hierarchical</h3><p><code>Coarse</code> uses fewer target stages such as first object placed and final state. <code>Hierarchical</code> uses finer stages such as grasp/place for each object. <code>Unordered</code> is progress-blind min-over-stage; treat it as a visual proxy, not clean planning.</p></section>`);
      }
      if (hasThreeObjectLongHorizon) {
        cards.push(`<section class="method-guide-card"><h3>Three-Object Rule</h3><p>Full success requires <code>all three ordered subtasks</code>. One or two completed placements should be marked <code>partial</code>, not success. These are baseline-only challenge pilots, not part of the two-object selection statistics.</p></section>`);
      }
      if (hasRolloutSelect) {
        cards.push(`<section class="method-guide-card"><h3>Rollout-Select</h3><p>External future-target selection. For each query, request multiple full action-video candidates from the same observation, compare predicted future video to either a <code>Subtask Target</code> schedule or a fixed <code>Final Target</code>, then execute the lowest-distance candidate. Scores use <code>Pixel L1</code> or <code>ViT Feature</code> distance.</p></section>`);
      }
      if (hasDenoiseBranch) {
        cards.push(`<section class="method-guide-card"><h3>Denoise-Branch</h3><p>Server-side branch selection inside the DreamZero denoising query. It chooses among alpha branches before returning one action chunk. <code>Subtask Decoded Pixel L1</code> decodes branch futures and compares them to scheduled targets; <code>Latent Zero + L2</code> is a control condition, not a task target.</p></section>`);
      }
      if (hasBreakthroughBank) {
        cards.push(`<section class="method-guide-card"><h3>Breakthrough Success Bank</h3><p><code>Breakthrough-Fixed</code> uses a higher-quality hierarchical target bank constructed from breakthrough success trajectories, then runs fixed-schedule ViT feature selection with <code>K=5</code>. Full long-horizon success still requires both ordered subtasks; strict labels come from subagent multi-frame video review.</p></section>`);
      }
      return `<div class="method-guide">${cards.join('')}</div>`;
    }
    function escapeAttr(s) {
      return String(s ?? '').replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;');
    }
    function escapeText(s) {
      return String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    }
    function loadOverrides() {

    function saveOverrides() {

      writeSecretInput.value = sessionStorage.getItem(WRITE_SECRET_SESSION_KEY) || '';
    }
    function currentBackendSettings() {
      const backendUrl = backendUrlInput.value.trim().replace(/\/+$/, '');
      const reviewerId = reviewerIdInput.value.trim().toLowerCase();
      const writeSecret = writeSecretInput.value;
      if (!backendUrl) throw new Error('Missing backend URL.');
      if (!/^[a-z0-9][a-z0-9._-]{1,62}[a-z0-9]$/.test(reviewerId)) {
        throw new Error('Invalid reviewer id. Use 3-64 chars: lowercase letters, numbers, dot, underscore, hyphen.');
      }
      if (!writeSecret) throw new Error('Missing write secret.');
      localStorage.setItem(BACKEND_URL_STORAGE_KEY, backendUrl);
      localStorage.setItem(REVIEWER_ID_STORAGE_KEY, reviewerId);
      sessionStorage.setItem(WRITE_SECRET_SESSION_KEY, writeSecret);
      return { backendUrl, reviewerId, writeSecret };
    }
    function updateLastSaveStatus() {
      const savedAt = localStorage.getItem(LAST_SAVE_STORAGE_KEY);
      lastSaveStatus.textContent = savedAt ? `last saved: ${new Date(savedAt).toLocaleString()}` : 'last saved: never';

    function overrideKey(taskId, modeId, groupId) {
      return `${taskId}::${modeId}::${groupId}`;

    function getOverride(taskId, modeId, groupId) {
      return manualOverrides[overrideKey(taskId, modeId, groupId)];
    }
    function applyManualOverride(taskId, modeId, groupId, item) {
      if (!item) return item;
      const override = getOverride(taskId, modeId, groupId);
      if (!override) return item;
      return {
        ...item,
        visual_success: override.visual_success,
        visual_label: override.visual_label || itemStatus(override.visual_success),
        note: `MANUAL OVERRIDE: ${override.label} · ${item.note || ''}`,
        manual_override: override,
      };
    }
    function taskWithOverrides(task) {
      const groups = task.groups.map(group => {
        const items = {};
        Object.entries(group.items).forEach(([modeId, item]) => {
          items[modeId] = applyManualOverride(task.task, modeId, group.group, item);
        });
        return { ...group, items };
      });
      const modes = task.modes.map(mode => {
        let count = 0;
        let successCount = 0;
        groups.forEach(group => {
          const item = group.items[mode.mode];
          const status = itemStatus(item);
          if (item && status !== 'wait_for_tag') {
            count += 1;
            successCount += status === 'success' ? 1 : 0;
          }
        });
        return {
          ...mode,
          count,
          success_count: successCount,
          rate: count ? successCount / count : null,
        };
      });
      return { ...task, groups, modes };
    }
    function effectiveTasks() {
      return DATA.tasks.map(taskWithOverrides);
    }
    function currentSection() {
      return sectionSelect.value || DATA.sections?.[0]?.section || 'six_task';

      const scenes = [...new Map(tasks.map(task => [task.scene_key || task.scene, task.scene || task.scene_key]).filter(([key]) => key)).entries()];
      const previous = preferredScene || currentSceneFilter();
      sceneSelect.innerHTML = '';

        option.value = key;
        option.textContent = label;
        sceneSelect.appendChild(option);
      });
      sceneSelect.value = scenes.some(([key]) => key === previous) ? previous : 'all';
    }
    function updateOverrideCount() {

    function auditControls(taskId, modeId, groupId, item) {

        <button class="audit-btn" data-audit-action="reset">Reset</button>
        ${override ? `<span class="manual-note dirty">edited: ${escapeText(override.label)}</span>` : `<span class="manual-note">current: ${status}</span>`}
      </div>`;
    }
    function itemCard(taskId, groupId, mode, item) {
      if (!item) {
        return `<article class="video-card" data-task="${escapeAttr(taskId)}" data-group="${groupId}" data-mode="${escapeAttr(mode.mode)}"><div class="video-title"><span>${escapeText(mode.label)}</span><span class="badge">not run</span></div><div class="empty">not run for this group</div></article>`;
      }
      const status = itemStatus(item);
      const stateClass = status === 'success' ? 'success' : status === 'partial' ? 'partial' : status === 'fail' ? 'failure' : status === 'wait_for_tag' ? 'wait' : 'unclear';
      const baselineClass = mode.mode === 'baseline_pass1' ? ' baseline' : '';
      const manualClass = item.manual_override ? ' manual-override' : '';
      const thumbs = [item.final_right, item.final_left, item.final_wrist].filter(Boolean).map(src => `<img src="${src}" loading="lazy">`).join('');
      const media = item.video
        ? `<video controls playsinline preload="none"${item.contact_sheet ? ` poster="${escapeAttr(item.contact_sheet)}"` : ''}><source src="${item.video}" type="video/mp4"></video>`
        : item.contact_sheet

          : `<div class="empty">no media</div>`;

        ${media}

        <div class="note">${escapeText([item.audit_source, item.motion_valid === false ? 'MOTION INVALID' : '', item.note || ''].filter(Boolean).join(' · '))}</div>

    function toBase64Utf8(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }
    function fromBase64Utf8(text) {
      const binary = atob(text.replaceAll('\n', ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    async function backendRequest(path, body, timeoutMs = BACKEND_TIMEOUT_MS) {
      const { backendUrl, reviewerId, writeSecret } = currentBackendSettings();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      const response = await fetch(`${backendUrl}${path}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Write-Secret': writeSecret,
        },
        body: JSON.stringify({ reviewer_id: reviewerId, write_secret: writeSecret, ...body }),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      const text = await response.text();
      let result = null;
      try {
        result = text ? JSON.parse(text) : null;
      } catch (err) {
        throw new Error(`Backend returned non-JSON response: ${text.slice(0, 240)}`);
      }
      if (!response.ok || !result?.ok) {
        throw new Error(result?.error || `Backend HTTP ${response.status}`);
      }
      return result;
    }
    async function backendRelayRequest(path, body, timeoutMs = 35000) {
      const { backendUrl, reviewerId, writeSecret } = currentBackendSettings();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      const relayBody = {
        backend_url: backendUrl,
        path,
        write_secret: writeSecret,
        body: { reviewer_id: reviewerId, write_secret: writeSecret, ...body },
      };
      const response = await fetch(`${SAVE_SERVER_URL}/relay-backend`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(relayBody),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      const text = await response.text();
      let result = null;
      try {
        result = text ? JSON.parse(text) : null;
      } catch (err) {
        throw new Error(`Local relay returned non-JSON response: ${text.slice(0, 240)}`);
      }
      if (!response.ok || !result?.ok || !result?.backend?.ok) {
        throw new Error(result?.backend?.error || result?.error || `Local relay HTTP ${response.status}`);
      }
      return result.backend;
    }
    async function backendRelayHealth(backendUrl, timeoutMs = 15000) {

      let result = null;
      try {

      } catch (err) {
        throw new Error(`Local relay health returned non-JSON response: ${text.slice(0, 240)}`);
      }
      if (!response.ok || !result?.ok || !result?.backend?.ok) {

    async function checkBackend() {

      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(`${backendUrl}/health`, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeout);
        const elapsed = Math.round(performance.now() - started);
        const result = await response.json();
        if (!response.ok || !result?.ok) throw new Error(result?.error || `HTTP ${response.status}`);
        saveStatus.textContent = `backend ok (${elapsed} ms)`;
        serverHelp.classList.remove('visible');
      } catch (err) {
        clearTimeout(timeout);
        try {
          saveStatus.textContent = 'direct backend failed; checking local relay...';
          await backendRelayHealth(backendUrl);
          const elapsed = Math.round(performance.now() - started);
          saveStatus.textContent = `backend ok via local relay (${elapsed} ms)`;
          showBackendHelp('Direct backend health check failed, but the localhost relay can reach the backend. You can use save via backend as long as the local save server remains running.');

        await navigator.clipboard.writeText(START_SERVER_COMMAND);
        saveStatus.textContent = 'start command copied';
        showServerHelp('Start command copied. Paste it into Terminal if the save server is not running.');
      } catch (err) {
        console.warn(err);
        saveStatus.textContent = 'copy unavailable';
        showServerHelp('Clipboard copy was blocked by the browser, but you can manually select the command below.');
      }
    }
    async function checkSaveServer() {
      saveStatus.textContent = 'checking server...';
      try {
        const response = await fetch(`${SAVE_SERVER_URL}/health`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        saveStatus.textContent = 'server running';
        serverHelp.classList.remove('visible');
        alert(`Save server is running.\nWriting to:\n${result.output_dir}`);
      } catch (err) {
        console.error(err);
        saveStatus.textContent = 'server not running';
        showServerHelp(`Save server is not reachable: ${err.message}`);
      }
    }
    async function saveAuditLocal() {
      saveStatus.textContent = 'saving...';
      const payload = {
        saved_at: new Date().toISOString(),
        overrides: overrideRows(),
        rows: fullAuditRows(),
      };
      try {
        const response = await fetch(`${SAVE_SERVER_URL}/save-audit-overrides`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        localStorage.setItem(LAST_SAVE_STORAGE_KEY, payload.saved_at);
        updateLastSaveStatus();
        saveStatus.textContent = `saved ${payload.overrides.length} edits`;
        serverHelp.classList.remove('visible');
        alert(`Saved manual audit files:\n${result.files.join('\n')}`);
      } catch (err) {
        console.error(err);
        saveStatus.textContent = 'save failed';
        downloadAuditBackup('failed_save');
        showServerHelp(`Save failed: ${err.message}`);
      }
    }
    function clearManualAudit() {
      if (!confirm('Clear all locally saved manual audit edits for this dashboard?')) return;
      manualOverrides = {};
      saveOverrides();
      render(taskSelect.value);
    }
    function applyFilters() {
      const active = document.querySelector('.scene-card.active');
      if (!active) return;
      const query = groupSearch.value.trim();
      const filter = resultFilter.value;
      document.body.classList.toggle('layout-cinema', layoutMode.value === 'cinema');
      document.body.classList.toggle('layout-contact', layoutMode.value === 'contact');
      if (layoutMode.value === 'contact') {
        active.querySelectorAll('.contact-fallback[data-src]:not([src])').forEach(img => {
          img.src = img.dataset.src;
        });
      }
      const visibleModes = new Set(Array.from(active.querySelectorAll('[data-mode-toggle]')).filter(i => i.checked).map(i => i.dataset.modeToggle));
      active.querySelectorAll('.video-card').forEach(card => card.classList.toggle('hidden-mode', !visibleModes.has(card.dataset.mode)));
      const cols = Math.max(1, visibleModes.size);
      active.querySelectorAll('.video-grid').forEach(grid => grid.style.setProperty('--visible-cols', cols));
      const normalizedQuery = query && /^\d+$/.test(query) ? String(Number(query)) : query;
      active.querySelectorAll('.group-row').forEach(row => {
        let hide = false;
        if (normalizedQuery && !String(row.dataset.group).includes(normalizedQuery)) hide = true;
        if (filter === 'any-fail' && row.dataset.anyFail !== 'true') hide = true;
        if (filter === 'baseline-fail' && row.dataset.baselineStatus === 'success') hide = true;
        if (filter === 'selection-win' && row.dataset.selectionWin !== 'true') hide = true;
        row.classList.toggle('is-filtered', hide);
      });
    }
    render();
    loadBackendSettings();
    const defaultPublicOverrideCount = Object.keys(loadDefaultPublicOverrides()).length;
    if (defaultPublicOverrideCount) {
      saveStatus.textContent = `loaded default public songjia labels (${defaultPublicOverrideCount})`;
    }
  </script>
</body>
</html>
