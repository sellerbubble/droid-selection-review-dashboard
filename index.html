<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DROID Selection Video Review</title>
  <style>
    :root {
      --ink: #15130f;
      --muted: #776f62;
      --paper: #f7f1e4;
      --panel: rgba(255, 252, 244, 0.88);
      --line: rgba(35, 29, 18, 0.16);
      --coal: #25231e;
      --good: #2e7d57;
      --bad: #b7442f;
      --warn: #b8860b;
      --accent: #d35f2d;
      --blue: #1e5b73;
      --shadow: 0 18px 45px rgba(38, 30, 16, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(211, 95, 45, .18), transparent 28rem),
        radial-gradient(circle at 86% 3%, rgba(30, 91, 115, .16), transparent 24rem),
        linear-gradient(135deg, #fbf5e7 0%, #eee1cb 54%, #ead7b7 100%);
      font-family: Charter, Georgia, "Times New Roman", serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mix-blend-mode: multiply;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 241, 228, .84);
      backdrop-filter: blur(18px);
    }
    .topbar {
      max-width: 1880px;
      margin: 0 auto;
      padding: 12px 24px 10px;
      display: grid;
      grid-template-columns: minmax(430px, .9fr) minmax(620px, 1.4fr);
      gap: 20px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-family: Didot, "Bodoni 72", Georgia, serif;
      font-size: clamp(30px, 3vw, 44px);
      line-height: .92;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }
    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      max-width: 760px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
    }
    select, input, button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.65);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 13px;
      font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }
    #sectionSelect { min-width: 220px; }
    #taskSelect { min-width: 310px; max-width: 520px; }
    #resultFilter, #layoutMode { min-width: 190px; }
    #groupSearch { width: 120px; }
    button {
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    button:hover { transform: translateY(-1px); background: white; }
    main {
      max-width: 1880px;
      margin: 0 auto;
      padding: 22px 24px 80px;
    }
    .task-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tab {
      border-radius: 18px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .45);
      cursor: pointer;
      font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tab.active {
      background: var(--coal);
      color: #fff7e8;
      box-shadow: var(--shadow);
    }
    .scene-card {
      display: none;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .scene-card.active { display: block; }
    .scene-head {
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(420px, .9fr) minmax(620px, 1.6fr);
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255,255,255,.62), rgba(255,255,255,.2));
    }
    .scene-title {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.02em;
    }
    .score-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-content: center;
      max-width: 1240px;
    }
    .score {
      min-width: 118px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.52);
    }
    .score.best {
      background: #1f372b;
      color: #fff8e9;
      border-color: transparent;
    }
    .score.best .name { color: rgba(255,248,233,.72); }
    .score .name {
      color: var(--muted);
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }
    .score .value {
      margin-top: 3px;
      font: 800 22px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .mode-toggles {
      padding: 14px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(255,255,255,.45);
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .mode-toggle input { width: auto; margin: 0; }
    .legend {
      margin-left: auto;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .method-guide {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 12px;
      padding: 0 18px 16px;
      border-bottom: 1px solid var(--line);
    }
    .method-guide-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 13px;
      background: rgba(255,255,255,.44);
    }
    .method-guide-card h3 {
      margin: 0 0 6px;
      font: 900 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
      color: var(--ink);
      letter-spacing: .02em;
    }
    .method-guide-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
    }
    .method-guide-card code {
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--blue);
      background: rgba(255,255,255,.62);
      border-radius: 6px;
      padding: 1px 4px;
    }
    .group-list { padding: 18px; display: grid; gap: 18px; }
    .group-row {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.48);
      overflow: hidden;
    }
    .group-row.selection-win {
      border-color: rgba(46, 125, 87, .55);
      box-shadow: inset 6px 0 0 var(--good);
    }
    .group-row.any-fail:not(.selection-win) {
      box-shadow: inset 6px 0 0 rgba(183, 68, 47, .78);
    }
    .group-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font: 800 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(37,35,30,.055);
    }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border-radius: 999px;
      padding: 3px 8px;
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid var(--line);
    }
    .chip.good { color: white; background: var(--good); border-color: transparent; }
    .chip.bad { color: white; background: var(--bad); border-color: transparent; }
    .chip.partial { color: white; background: var(--warn); border-color: transparent; }
    .chip.missing { color: var(--muted); background: rgba(255,255,255,.5); }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(var(--visible-cols, 5), minmax(300px, 1fr));
      gap: 1px;
      background: var(--line);
    }
    .video-card {
      background: #fffaf0;
      min-width: 0;
      padding: 12px;
    }
    .video-card.success {
      background: linear-gradient(180deg, rgba(46,125,87,.10), #fffaf0 58%);
    }
    .video-card.failure {
      background: linear-gradient(180deg, rgba(183,68,47,.12), #fffaf0 58%);
    }
    .video-card.partial {
      background: linear-gradient(180deg, rgba(184,134,11,.15), #fffaf0 58%);
    }
    .video-card.unclear {
      background: linear-gradient(180deg, rgba(119,111,98,.12), #fffaf0 58%);
    }
    .video-card.baseline {
      border-top: 4px solid var(--coal);
    }
    .video-card.hidden-mode { display: none; }
    .video-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .badge {
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      color: white;
      background: var(--muted);
    }
    .badge.good { background: var(--good); }
    .badge.bad { background: var(--bad); }
    .badge.partial { background: var(--warn); }
    .badge.manual { background: var(--blue); }
    .audit-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 10px;
      align-items: center;
      padding: 8px;
      border: 1px dashed rgba(30, 91, 115, .36);
      border-radius: 12px;
      background: rgba(255,255,255,.58);
    }
    .audit-btn {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      background: rgba(255,255,255,.7);
    }
    .audit-btn[data-audit-action="success"] { border-color: rgba(46, 125, 87, .55); }
    .audit-btn[data-audit-action="partial"] { border-color: rgba(184, 134, 11, .55); }
    .audit-btn[data-audit-action="fail"] { border-color: rgba(183, 68, 47, .55); }
    .audit-btn[data-audit-action="unclear"] { border-color: rgba(184, 134, 11, .55); }
    .audit-btn.active-success {
      color: white;
      background: var(--good);
      border-color: transparent;
    }
    .audit-btn.active-fail {
      color: white;
      background: var(--bad);
      border-color: transparent;
    }
    .audit-btn.active-partial {
      color: white;
      background: var(--warn);
      border-color: transparent;
    }
    .audit-btn.active-unclear {
      color: white;
      background: var(--warn);
      border-color: transparent;
    }
    .video-card.manual-override {
      outline: 3px solid rgba(30, 91, 115, .42);
      outline-offset: -3px;
    }
    .manual-note {
      color: var(--blue);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .manual-note.dirty {
      color: var(--warn);
    }
    .audit-label {
      color: var(--blue);
      font: 900 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    #overrideCount {
      color: var(--blue);
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 0 4px;
    }
    #saveStatus {
      min-width: 180px;
      color: var(--muted);
      font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .server-help {
      display: none;
      grid-column: 1 / -1;
      width: min(980px, 100%);
      margin-left: auto;
      padding: 12px 14px;
      border: 1px solid rgba(184, 134, 11, .32);
      border-radius: 16px;
      background: rgba(255, 246, 214, .84);
      color: #56431a;
      font: 700 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .server-help.visible { display: block; }
    .server-help code {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.8);
      color: #1e1a12;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: all;
    }
    video, .fallback-img {
      width: 100%;
      aspect-ratio: 960 / 204;
      object-fit: contain;
      background: #15130f;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.16);
      display: block;
    }
    .fallback-img.contact-fallback { display: none; }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .thumbs img {
      width: 100%;
      aspect-ratio: 1.35;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: white;
    }
    .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      min-height: 16px;
    }
    .empty {
      min-height: 210px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      border-radius: 14px;
      background: rgba(0,0,0,.035);
    }
    .is-filtered { display: none; }
    body.layout-cinema .video-grid {
      grid-template-columns: repeat(2, minmax(540px, 1fr)) !important;
      gap: 12px;
      background: transparent;
      padding: 12px;
    }
    body.layout-cinema .video-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(38, 30, 16, .08);
    }
    body.layout-cinema video,
    body.layout-cinema .fallback-img {
      aspect-ratio: 960 / 204;
    }
    body.layout-contact .video-card video {
      display: none;
    }
    body.layout-contact .fallback-img.contact-fallback {
      display: block;
    }
    @media (max-width: 980px) {
      .topbar, .scene-head { grid-template-columns: 1fr; }
      .controls, .score-strip { justify-content: flex-start; }
      h1 { white-space: normal; }
      .video-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>

      </div>
    </div>
  </header>

    <div id="cards"></div>

  <script>
    const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);

    let manualOverrides = loadOverrides();
    let globalEventsBound = false;

    function pct(value) {
      if (value === null || value === undefined) return 'n/a';
      return Math.round(value * 100) + '%';
    }
    function itemStatus(itemOrValue) {
      if (itemOrValue && typeof itemOrValue === 'object') {
        if (itemOrValue.visual_label) return itemOrValue.visual_label;
        return itemStatus(itemOrValue.visual_success);
      }
      if (itemOrValue === true) return 'success';
      if (itemOrValue === false) return 'fail';
      return 'unclear';
    }
    function statusToVisualSuccess(status) {
      if (status === 'success') return true;
      if (status === 'fail' || status === 'partial') return false;
      return null;
    }
    function successBadge(itemOrValue) {
      const status = itemStatus(itemOrValue);
      if (status === 'success') return '<span class="badge good">success</span>';
      if (status === 'partial') return '<span class="badge partial">partial</span>';
      if (status === 'fail') return '<span class="badge bad">fail</span>';
      return '<span class="badge">unclear</span>';
    }
    function manualBadge(hasOverride) {
      return hasOverride ? '<span class="badge manual">manual</span>' : '';
    }
    function chip(label, itemOrValue) {
      const status = itemStatus(itemOrValue);
      const cls = status === 'success' ? 'good' : status === 'partial' ? 'partial' : status === 'fail' ? 'bad' : 'missing';
      const text = status === 'success' ? '✓' : status === 'partial' ? '½' : status === 'fail' ? '×' : '?';
      return `<span class="chip ${cls}">${label} ${text}</span>`;
    }
    function modeChipLabel(modeId, modeLabel) {
      const labels = {
        baseline_pass1: 'Base',
        target_l1_last_schedule_retrieved_success_exclude_self_g20_k5: 'Rollout-Sub-L1',
        target_feature_last_schedule_retrieved_success_exclude_self_g20_k5: 'Rollout-Sub-ViT',
        target_l1_last_retrieved_success_exclude_self_g20_k5: 'Rollout-Final-L1',
        target_feature_last_retrieved_success_exclude_self_g20_k5: 'Rollout-Final-ViT',
        d2c_latent_l2_target_zero: 'Branch-Zero-L2',
        d2c_decoded_pixel_l1_schedule: 'Branch-Sub-L1',
        d2c_decoded_pixel_l1_schedule_strongalpha: 'Branch-Sub-L1α',
        coarse_fixed_vit_g5_k3: 'Coarse-Fixed',
        coarse_unordered_vit_g5_k3: 'Coarse-Unord',
        hierarchical_fixed_vit_g5_k3: 'Hier-Fixed',
        hierarchical_unordered_vit_g5_k3: 'Hier-Unord',
      };
      return labels[modeId] || modeLabel.split(' ')[0];
    }
    function methodGuide(task) {
      const modeIds = new Set(task.modes.map(mode => mode.mode));
      const hasRolloutSelect = Array.from(modeIds).some(mode => mode.startsWith('target_'));
      const hasDenoiseBranch = Array.from(modeIds).some(mode => mode.startsWith('d2c_'));
      const hasLongHorizon = task.section === 'long_horizon';
      const hasThreeObjectLongHorizon = task.section === 'three_object_long_horizon';
      const cards = [
        `<section class="method-guide-card"><h3>Baseline</h3><p><code>DreamZero pass@1</code>: one normal rollout from the fixed initial state. No target image, no candidate selection, no branch intervention.</p></section>`
      ];
      if (hasLongHorizon) {
        cards.push(`<section class="method-guide-card"><h3>Long-Horizon Rule</h3><p>Full success requires <code>both ordered subtasks</code>. If only the first subtask is completed, mark <code>partial</code>, not success. Selection labels marked preliminary should be re-checked with the full rollout video.</p></section>`);
        cards.push(`<section class="method-guide-card"><h3>Coarse vs Hierarchical</h3><p><code>Coarse</code> uses fewer target stages such as first object placed and final state. <code>Hierarchical</code> uses finer stages such as grasp/place for each object. <code>Unordered</code> is progress-blind min-over-stage; treat it as a visual proxy, not clean planning.</p></section>`);
      }
      if (hasThreeObjectLongHorizon) {
        cards.push(`<section class="method-guide-card"><h3>Three-Object Rule</h3><p>Full success requires <code>all three ordered subtasks</code>. One or two completed placements should be marked <code>partial</code>, not success. These are baseline-only challenge pilots, not part of the two-object selection statistics.</p></section>`);
      }
      if (hasRolloutSelect) {
        cards.push(`<section class="method-guide-card"><h3>Rollout-Select</h3><p>External future-target selection. For each query, request multiple full action-video candidates from the same observation, compare predicted future video to either a <code>Subtask Target</code> schedule or a fixed <code>Final Target</code>, then execute the lowest-distance candidate. Scores use <code>Pixel L1</code> or <code>ViT Feature</code> distance.</p></section>`);
      }
      if (hasDenoiseBranch) {
        cards.push(`<section class="method-guide-card"><h3>Denoise-Branch</h3><p>Server-side branch selection inside the DreamZero denoising query. It chooses among alpha branches before returning one action chunk. <code>Subtask Decoded Pixel L1</code> decodes branch futures and compares them to scheduled targets; <code>Latent Zero + L2</code> is a control condition, not a task target.</p></section>`);
      }
      return `<div class="method-guide">${cards.join('')}</div>`;
    }
    function escapeAttr(s) {
      return String(s ?? '').replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;');
    }
    function escapeText(s) {
      return String(s ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    }
    function loadOverrides() {
      try {
        return JSON.parse(localStorage.getItem(REVIEW_STORAGE_KEY) || '{}');

        console.warn('Failed to load manual overrides', err);
        return {};

    }
    function saveOverrides() {
      localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(manualOverrides));
      updateOverrideCount();
      saveStatus.textContent = 'unsaved local edits';
    }
    function overrideKey(taskId, modeId, groupId) {
      return `${taskId}::${modeId}::${groupId}`;
    }
    function getOverride(taskId, modeId, groupId) {
      return manualOverrides[overrideKey(taskId, modeId, groupId)];
    }
    function applyManualOverride(taskId, modeId, groupId, item) {
      if (!item) return item;
      const override = getOverride(taskId, modeId, groupId);
      if (!override) return item;
      return {
        ...item,
        visual_success: override.visual_success,
        visual_label: override.visual_label || itemStatus(override.visual_success),
        note: `MANUAL OVERRIDE: ${override.label} · ${item.note || ''}`,
        manual_override: override,
      };
    }
    function taskWithOverrides(task) {
      const groups = task.groups.map(group => {
        const items = {};
        Object.entries(group.items).forEach(([modeId, item]) => {
          items[modeId] = applyManualOverride(task.task, modeId, group.group, item);
        });
        return { ...group, items };
      });
      const modes = task.modes.map(mode => {
        let count = 0;
        let successCount = 0;
        groups.forEach(group => {
          const item = group.items[mode.mode];
          const status = itemStatus(item);
          if (item) {
            count += 1;
            successCount += status === 'success' ? 1 : 0;
          }
        });
        return {
          ...mode,
          count,
          success_count: successCount,
          rate: count ? successCount / count : null,
        };
      });
      return { ...task, groups, modes };
    }
    function effectiveTasks() {
      return DATA.tasks.map(taskWithOverrides);
    }
    function currentSection() {
      return sectionSelect.value || DATA.sections?.[0]?.section || 'six_task';
    }
    function sectionTasks() {
      const section = currentSection();
      return effectiveTasks().filter(task => (task.section || 'six_task') === section);
    }
    function populateSections() {
      if (sectionSelect.options.length) return;
      const sections = DATA.sections || [{ section: 'six_task', label: 'Six-Task Selection' }];
      sections.forEach(section => {
        const option = document.createElement('option');
        option.value = section.section;
        option.textContent = section.label;
        sectionSelect.appendChild(option);
      });
    }
    function updateOverrideCount() {
      const count = Object.keys(manualOverrides).length;
      overrideCount.textContent = `${count} edit${count === 1 ? '' : 's'}`;
    }
    function auditControls(taskId, modeId, groupId, item) {
      const override = getOverride(taskId, modeId, groupId);
      const status = override ? (override.visual_label || itemStatus(override.visual_success)) : itemStatus(item);
      const active = name => override && override.label === name ? ` active-${name}` : '';
      return `<div class="audit-controls" data-task="${escapeAttr(taskId)}" data-mode="${escapeAttr(modeId)}" data-group="${groupId}">
        <span class="audit-label">Manual audit</span>
        <button class="audit-btn${active('success')}" data-audit-action="success">Mark success</button>
        <button class="audit-btn${active('partial')}" data-audit-action="partial">Mark partial</button>
        <button class="audit-btn${active('fail')}" data-audit-action="fail">Mark fail</button>
        <button class="audit-btn${active('unclear')}" data-audit-action="unclear">Mark unclear</button>
        <button class="audit-btn" data-audit-action="reset">Reset</button>
        ${override ? `<span class="manual-note dirty">edited: ${escapeText(override.label)}</span>` : `<span class="manual-note">current: ${status}</span>`}
      </div>`;
    }
    function itemCard(taskId, groupId, mode, item) {
      if (!item) {
        return `<article class="video-card" data-task="${escapeAttr(taskId)}" data-group="${groupId}" data-mode="${escapeAttr(mode.mode)}"><div class="video-title"><span>${escapeText(mode.label)}</span><span class="badge">missing</span></div><div class="empty">no video synced</div></article>`;
      }
      const status = itemStatus(item);
      const stateClass = status === 'success' ? 'success' : status === 'partial' ? 'partial' : status === 'fail' ? 'failure' : 'unclear';
      const baselineClass = mode.mode === 'baseline_pass1' ? ' baseline' : '';
      const manualClass = item.manual_override ? ' manual-override' : '';
      const thumbs = [item.final_right, item.final_left, item.final_wrist].filter(Boolean).map(src => `<img src="${src}" loading="lazy">`).join('');
      const media = item.video
        ? `<video controls playsinline preload="none"${item.contact_sheet ? ` poster="${escapeAttr(item.contact_sheet)}"` : ''}><source src="${item.video}" type="video/mp4"></video>`
        : item.contact_sheet
          ? `<img class="fallback-img" src="${item.contact_sheet}" loading="lazy">`
          : `<div class="empty">no media</div>`;
      const contact = item.video && item.contact_sheet ? `<img class="fallback-img contact-fallback" data-src="${escapeAttr(item.contact_sheet)}" loading="lazy">` : '';
      return `<article class="video-card ${stateClass}${baselineClass}${manualClass}" data-task="${escapeAttr(taskId)}" data-group="${groupId}" data-mode="${escapeAttr(mode.mode)}">
        <div class="video-title"><span>${escapeText(mode.label)}</span><span>${manualBadge(!!item.manual_override)}${successBadge(item)}</span></div>
        ${auditControls(taskId, mode.mode, groupId, item)}
        ${media}
        ${contact}
        ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
        <div class="note">${escapeText([item.audit_source, item.motion_valid === false ? 'MOTION INVALID' : '', item.note || ''].filter(Boolean).join(' · '))}</div>
      </article>`;
    }
    function render(preferredTask) {
      populateSections();
      const previousTask = preferredTask || taskSelect.value || DATA.tasks[0]?.task;

      const tasks = sectionTasks();
      const activeTask = tasks.some(task => task.task === previousTask) ? previousTask : tasks[0]?.task;
      tabs.innerHTML = '';

        option.value = task.task;
        option.textContent = task.label;
        taskSelect.appendChild(option);
      });
      const task = tasks.find(task => task.task === activeTask);
      if (task) {
        const card = document.createElement('section');
        card.className = 'scene-card active';
        card.dataset.task = task.task;
        const bestRate = Math.max(...task.modes.map(mode => mode.rate ?? -1));

        const toggles = task.modes.map(mode => `<label class="mode-toggle"><input type="checkbox" checked data-mode-toggle="${escapeAttr(mode.mode)}">${escapeText(mode.label)}</label>`).join('');
        const groupRows = task.groups.map(group => {
          const baseline = group.items.baseline_pass1?.visual_success;

          const rowClass = `${anySelectionWin ? ' selection-win' : ''}${anyFail ? ' any-fail' : ''}`;
          return `<section class="group-row${rowClass}" data-group="${group.group}" data-baseline="${baseline}" data-baseline-status="${baselineStatus}" data-any-fail="${anyFail}" data-selection-win="${anySelectionWin}">
            <div class="group-head"><span>group_${String(group.group).padStart(3, '0')}</span><div class="chips">${chips}</div></div>
            <div class="video-grid" style="--visible-cols:${task.modes.length}">${cards}</div>
          </section>`;
        }).join('');
        card.innerHTML = `<div class="scene-head"><div><h2 class="scene-title">${escapeText(task.label)}</h2><div class="subtitle">${task.groups.length} groups · ${task.modes.length} policies/modes · green row = selection rescues baseline failure</div></div><div class="score-strip">${scores}</div></div><div class="mode-toggles">${toggles}<span class="legend"><span class="chip good">success</span><span class="chip partial">partial</span><span class="chip bad">fail</span><span class="chip missing">unlabeled</span></span></div>${methodGuide(task)}<div class="group-list">${groupRows}</div>`;
        cards.appendChild(card);
      }
      sectionSelect.value = previousSection;
      if (activeTask) taskSelect.value = activeTask;
      resultFilter.value = previousFilter;
      layoutMode.value = previousLayout;
      groupSearch.value = previousQuery;
      bindGlobalEventsOnce();
      bindTaskEvents();
      bindVideoFallbacks();
      bindAuditButtons();
      updateOverrideCount();
      applyFilters();
    }
    function bindVideoFallbacks() {
      document.querySelectorAll('.video-card video').forEach(video => {
        if (video.dataset.fallbackBound === '1') return;
        video.dataset.fallbackBound = '1';
        video.addEventListener('error', () => {
          const card = video.closest('.video-card');
          if (!card) return;
          const fallback = card.querySelector('.contact-fallback');
          if (fallback) {
            if (!fallback.src && fallback.dataset.src) fallback.src = fallback.dataset.src;
            video.style.display = 'none';
            fallback.style.display = 'block';
          }
        });
      });
    }
    function setActiveTask(taskId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.task === taskId));
      document.querySelectorAll('.scene-card').forEach(c => c.classList.toggle('active', c.dataset.task === taskId));
      taskSelect.value = taskId;
      applyFilters();
    }
    function bindGlobalEventsOnce() {
      if (globalEventsBound) return;
      globalEventsBound = true;
      sectionSelect.addEventListener('change', () => render());
      taskSelect.addEventListener('change', () => render(taskSelect.value));
      resultFilter.addEventListener('change', applyFilters);
      layoutMode.addEventListener('change', applyFilters);
      groupSearch.addEventListener('input', applyFilters);
      document.getElementById('playVisible').addEventListener('click', () => document.querySelectorAll('.scene-card.active .group-row:not(.is-filtered) video').forEach(v => v.play()));
      document.getElementById('pauseVisible').addEventListener('click', () => document.querySelectorAll('video').forEach(v => v.pause()));
      document.getElementById('saveAuditLocal').addEventListener('click', saveAuditLocal);
      document.getElementById('checkSaveServer').addEventListener('click', checkSaveServer);
      document.getElementById('copyServerCommand').addEventListener('click', copyStartServerCommand);
      document.getElementById('exportAuditCsv').addEventListener('click', exportAuditCsv);
      document.getElementById('exportAuditJson').addEventListener('click', exportAuditJson);
      document.getElementById('clearManualAudit').addEventListener('click', clearManualAudit);
    }
    function bindTaskEvents() {
      tabs.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => render(tab.dataset.task)));
      document.querySelectorAll('[data-mode-toggle]').forEach(input => input.addEventListener('change', applyFilters));
    }
    function bindAuditButtons() {
      document.querySelectorAll('[data-audit-action]').forEach(button => {
        if (button.dataset.bound === '1') return;
        button.dataset.bound = '1';
        button.addEventListener('click', event => {
          const controls = event.target.closest('.audit-controls');
          const taskId = controls.dataset.task;
          const modeId = controls.dataset.mode;
          const groupId = controls.dataset.group;
          const action = event.target.dataset.auditAction;
          const key = overrideKey(taskId, modeId, groupId);
          if (action === 'reset') {
            delete manualOverrides[key];
          } else {
            const visualSuccess = statusToVisualSuccess(action);
            const original = DATA.tasks
              .find(task => task.task === taskId)?.groups
              .find(group => String(group.group) === String(groupId))?.items?.[modeId]?.visual_success;
            const originalLabel = DATA.tasks
              .find(task => task.task === taskId)?.groups
              .find(group => String(group.group) === String(groupId))?.items?.[modeId]?.visual_label || itemStatus(original);
            manualOverrides[key] = {
              task: taskId,
              mode: modeId,
              group: Number(groupId),
              visual_success: visualSuccess,
              visual_label: action,
              label: action,
              original_visual_success: original ?? null,
              original_visual_label: originalLabel,
              updated_at: new Date().toISOString(),
            };
          }
          saveOverrides();
          refreshSingleCard(taskId, modeId, Number(groupId));
          refreshGroupSummary(taskId, Number(groupId));
          refreshTaskScores(taskId);
          applyFilters();
        });
      });
    }
    function findTask(taskId) {
      return DATA.tasks.find(task => task.task === taskId);
    }
    function findGroup(task, groupId) {
      return task?.groups.find(group => Number(group.group) === Number(groupId));
    }
    function findMode(task, modeId) {
      return task?.modes.find(mode => mode.mode === modeId);
    }
    function refreshSingleCard(taskId, modeId, groupId) {
      const task = findTask(taskId);
      const group = findGroup(task, groupId);
      const mode = findMode(task, modeId);
      if (!task || !group || !mode) return;
      const originalItem = group.items[modeId];
      const item = applyManualOverride(taskId, modeId, groupId, originalItem);
      const oldCard = document.querySelector(`.video-card[data-task="${CSS.escape(taskId)}"][data-group="${groupId}"][data-mode="${CSS.escape(modeId)}"]`);
      if (!oldCard) return;
      oldCard.outerHTML = itemCard(taskId, groupId, mode, item);
      bindAuditButtons();
      bindVideoFallbacks();
    }
    function refreshTaskScores(taskId) {
      const task = taskWithOverrides(findTask(taskId));
      const sceneCard = document.querySelector(`.scene-card[data-task="${CSS.escape(taskId)}"]`);
      if (!task || !sceneCard) return;
      const bestRate = Math.max(...task.modes.map(mode => mode.rate ?? -1));
      const scores = task.modes.map(mode => `<div class="score ${mode.rate === bestRate ? 'best' : ''}"><div class="name">${escapeText(mode.label)}</div><div class="value">${pct(mode.rate)}</div></div>`).join('');
      const strip = sceneCard.querySelector('.score-strip');
      if (strip) strip.innerHTML = scores;
    }
    function refreshGroupSummary(taskId, groupId) {
      const task = taskWithOverrides(findTask(taskId));
      const group = findGroup(task, groupId);
      const row = document.querySelector(`.scene-card[data-task="${CSS.escape(taskId)}"] .group-row[data-group="${groupId}"]`);
      if (!task || !group || !row) return;
      const baseline = group.items.baseline_pass1?.visual_success;
      const selectionItems = Object.entries(group.items).filter(([mode]) => mode !== 'baseline_pass1').map(([, item]) => item);
      const baselineStatus = itemStatus(group.items.baseline_pass1);
      const anySelectionWin = baselineStatus !== 'success' && selectionItems.some(item => itemStatus(item) === 'success');
      const anyFail = [group.items.baseline_pass1, ...selectionItems].some(item => ['fail', 'partial'].includes(itemStatus(item)));
      row.dataset.baseline = String(baseline);
      row.dataset.baselineStatus = String(baselineStatus);
      row.dataset.anyFail = String(anyFail);
      row.dataset.selectionWin = String(anySelectionWin);
      row.classList.toggle('selection-win', anySelectionWin);
      row.classList.toggle('any-fail', anyFail);
      const chips = row.querySelector('.chips');
      if (chips) chips.innerHTML = task.modes.map(mode => chip(modeChipLabel(mode.mode, mode.label), group.items[mode.mode])).join('');
    }
    function overrideRows() {
      return Object.values(manualOverrides).sort((a, b) =>
        `${a.task}::${a.mode}::${a.group}`.localeCompare(`${b.task}::${b.mode}::${b.group}`)
      );
    }
    function downloadText(filename, text, mimeType) {
      const blob = new Blob([text], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
    function csvEscape(value) {
      const text = String(value ?? '');
      return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
    }
    function exportAuditCsv() {
      const header = ['task','mode','group','manual_visual_success','manual_visual_label','manual_label','original_visual_success','original_visual_label','updated_at'];
      const rows = overrideRows().map(row => [
        row.task,
        row.mode,
        row.group,
        row.visual_success,
        row.visual_label,
        row.label,
        row.original_visual_success,
        row.original_visual_label,
        row.updated_at,
      ]);
      const csv = [header, ...rows].map(row => row.map(csvEscape).join(',')).join('\n') + '\n';
      downloadText('manual_audit_overrides.csv', csv, 'text/csv;charset=utf-8');
    }
    function exportAuditJson() {
      downloadText('manual_audit_overrides.json', JSON.stringify(overrideRows(), null, 2), 'application/json;charset=utf-8');
    }
    function fullAuditRows() {
      const rows = [];
      DATA.tasks.forEach(task => {
        task.groups.forEach(group => {
          task.modes.forEach(mode => {
            const item = group.items[mode.mode];
            if (!item) return;
            const override = getOverride(task.task, mode.mode, group.group);
            rows.push({
              task: task.task,
              task_label: task.label,
              mode: mode.mode,
              mode_label: mode.label,
              group: group.group,
              original_visual_success: item.visual_success,
              original_visual_label: item.visual_label || itemStatus(item),
              current_visual_success: override ? override.visual_success : item.visual_success,
              current_visual_label: override ? (override.visual_label || override.label) : (item.visual_label || itemStatus(item)),
              manual_label: override ? override.label : '',
              manual_updated_at: override ? override.updated_at : '',
              audit_source: item.audit_source || '',
              motion_valid: item.motion_valid ?? '',
              note: item.note || '',
              video: item.video || '',
              contact_sheet: item.contact_sheet || '',
            });
          });
        });
      });
      return rows;
    }
    function showServerHelp(message) {
      serverHelp.classList.add('visible');
      serverHelp.innerHTML = `${escapeText(message)}<br><br>Because this dashboard is opened as a static local file, the browser is not allowed to start a Python process by itself. Start the tiny local writer once, then click <b>save local</b> again.<br><br>Option A: copy and run this command in Terminal:<code>${escapeText(START_SERVER_COMMAND)}</code>Option B: double-click this generated launcher:<code>${escapeText(START_SERVER_SCRIPT)}</code>Your current edits are still safe in this browser's localStorage.`;
    }
    async function copyStartServerCommand() {
      try {
        await navigator.clipboard.writeText(START_SERVER_COMMAND);
        saveStatus.textContent = 'start command copied';
        showServerHelp('Start command copied. Paste it into Terminal if the save server is not running.');
      } catch (err) {
        console.warn(err);
        saveStatus.textContent = 'copy unavailable';
        showServerHelp('Clipboard copy was blocked by the browser, but you can manually select the command below.');
      }
    }
    async function checkSaveServer() {
      saveStatus.textContent = 'checking server...';
      try {
        const response = await fetch(`${SAVE_SERVER_URL}/health`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        saveStatus.textContent = 'server running';
        serverHelp.classList.remove('visible');
        alert(`Save server is running.\nWriting to:\n${result.output_dir}`);
      } catch (err) {
        console.error(err);
        saveStatus.textContent = 'server not running';
        showServerHelp(`Save server is not reachable: ${err.message}`);
      }
    }
    async function saveAuditLocal() {
      saveStatus.textContent = 'saving...';
      const payload = {
        saved_at: new Date().toISOString(),
        overrides: overrideRows(),
        rows: fullAuditRows(),
      };
      try {
        const response = await fetch(`${SAVE_SERVER_URL}/save-audit-overrides`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        saveStatus.textContent = `saved ${payload.overrides.length} edits`;
        serverHelp.classList.remove('visible');
        alert(`Saved manual audit files:\n${result.files.join('\n')}`);
      } catch (err) {
        console.error(err);
        saveStatus.textContent = 'save failed';
        showServerHelp(`Save failed: ${err.message}`);
      }
    }
    function clearManualAudit() {
      if (!confirm('Clear all locally saved manual audit edits for this dashboard?')) return;
      manualOverrides = {};
      saveOverrides();
      render(taskSelect.value);
    }
    function applyFilters() {
      const active = document.querySelector('.scene-card.active');
      if (!active) return;
      const query = groupSearch.value.trim();
      const filter = resultFilter.value;
      document.body.classList.toggle('layout-cinema', layoutMode.value === 'cinema');
      document.body.classList.toggle('layout-contact', layoutMode.value === 'contact');
      if (layoutMode.value === 'contact') {
        active.querySelectorAll('.contact-fallback[data-src]:not([src])').forEach(img => {
          img.src = img.dataset.src;
        });
      }
      const visibleModes = new Set(Array.from(active.querySelectorAll('[data-mode-toggle]')).filter(i => i.checked).map(i => i.dataset.modeToggle));
      active.querySelectorAll('.video-card').forEach(card => card.classList.toggle('hidden-mode', !visibleModes.has(card.dataset.mode)));
      const cols = Math.max(1, visibleModes.size);
      active.querySelectorAll('.video-grid').forEach(grid => grid.style.setProperty('--visible-cols', cols));
      const normalizedQuery = query && /^\d+$/.test(query) ? String(Number(query)) : query;
      active.querySelectorAll('.group-row').forEach(row => {
        let hide = false;
        if (normalizedQuery && !String(row.dataset.group).includes(normalizedQuery)) hide = true;
        if (filter === 'any-fail' && row.dataset.anyFail !== 'true') hide = true;
        if (filter === 'baseline-fail' && row.dataset.baselineStatus === 'success') hide = true;
        if (filter === 'selection-win' && row.dataset.selectionWin !== 'true') hide = true;
        row.classList.toggle('is-filtered', hide);
      });
    }
    render();
  </script>
</body>
</html>
